# Local or single-server setup: the app + PostgreSQL. Put HTTPS in front of it (see DEPLOY.md); WhatsApp needs a public https webhook URL.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: shared_living
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shared_living"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shared_living
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  dbdata:
