name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shared_living_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shared_living_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (server and web)
        run: npm run typecheck
      - name: Tests (money, planner, isolation, pipeline, webhook, adapters against fakes)
        run: npm test
      - name: Eval (rules only; no API key in CI)
        run: npm run eval
      - name: Build dashboard
        run: npm run build:web

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (app + Postgres)
        run: docker compose up -d --build
      - name: Wait for the app health check
        run: |
          for i in $(seq 1 40); do
            s=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || true)
            [ "$s" = healthy ] && break
            sleep 3
          done
          echo "health=$s"
          test "$s" = healthy
          curl -fsS localhost:3000/healthz
          curl -fsS -o /dev/null localhost:3000/privacy
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
